[package]
name = "sonolil_camera"
version = "0.1.0"
edition = "2021"

[features]
hub = ["sonolil_hub", "sonolil_movement/hub"]

[dependencies]
sonolil_hub = { path = "../_hub", optional = true }
sonolil_render = { path = "../render"}
sonolil_movement = { path = "../movement"}
bevy = { workspace = true, features = ["bevy_winit"]}
bevy_framepace = { workspace = true }